name: Normalize contact links

on:
  push:
    paths:
      - '.github/workflows/normalize-contact-links.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy contact links
        shell: bash
        run: |
          find . -type f \( -name '*.html' -o -name '*.css' \) -not -path './.git/*' -print0 | xargs -0 sed -i 's|href="/contact"|href="/#contact"|g'
          rm -f .github/workflows/normalize-contact-links.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Use #contact as the single contact destination"
            git push
          fi
