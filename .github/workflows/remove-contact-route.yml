name: Remove legacy contact route

on:
  push:
    paths:
      - '.github/workflows/remove-contact-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy /contact route script
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''    <script>\n      if (window.location.pathname.replace(/\\/+$/, "") === "/contact") {\n        document.documentElement.classList.add("contact-route");\n        document.title = "Contact Anchor | Request a Quote or Free Mockup";\n        document.querySelector('link[rel="canonical"]')?.setAttribute("href", "https://anchor-studios.web.app/contact");\n      } else {\n        document.documentElement.classList.add("home-route");\n      }\n    </script>'''
          new = '''    <script>\n      document.documentElement.classList.add("home-route");\n    </script>'''

          if old not in text:
              raise SystemExit('Legacy /contact script block not found; no changes made.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/remove-contact-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy /contact canonical logic"
          git push
